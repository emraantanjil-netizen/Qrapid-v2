<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Noon QR Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
  --primary-yellow: #FEEE00;
  --yellow-hover: #FFD500;
  --dark-gray: #3D3D45;
  --text-color: #222222;
  --background: #FAFAFA;
  --light-gray: #EAEAEA;
  --white: #FFFFFF;
  --border-radius: 18px;
  --transition: 0.3s ease;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  background: var(--background);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  background: var(--white);
  width:100%;
  max-width:500px;
  border-radius:24px;
  padding:35px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  text-align:center;
  border: 3px solid var(--primary-yellow);
}

.logo-circle{
  width:70px;
  height:70px;
  border:12px solid var(--dark-gray);
  border-top-color: transparent;
  border-radius:50%;
  margin:0 auto 15px;
}

h1{
  color:var(--dark-gray);
  margin-bottom:10px;
}

.subtitle{
  color:#666;
  margin-bottom:25px;
}

.input-group{
  display:flex;
  flex-direction:column;
  gap:12px;
}

input{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:2px solid var(--light-gray);
  outline:none;
  font-size:16px;
  transition: var(--transition);
}

input:focus{
  border-color: var(--primary-yellow);
}

#qrcode{
  margin-top:30px;
  display:flex;
  justify-content:center;
}

.qr-box{
  background:white;
  padding:20px;
  border-radius:20px;
  border:2px dashed var(--light-gray);
  min-width:260px;
  min-height:260px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.placeholder-text{
  color:#888;
  font-size:15px;
}

.action-buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

button{
  flex:1;
  border:none;
  padding:15px;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
  transition: var(--transition);
}

.download-btn,
.print-btn{
  background: var(--dark-gray);
  color:white;
}

.download-btn:hover,
.print-btn:hover{
  transform: translateY(-2px);
}

.footer{
  margin-top:20px;
  color:#777;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo-circle"></div>

  <h1>QR Code Generator</h1>
  <p class="subtitle">
    Generate & Download QR Instantly
  </p>

  <div class="input-group">
    <input
      type="text"
      id="qrText"
      placeholder="Enter URL or Text"
    />
  </div>

  <div id="qrcode"></div>

  <div class="action-buttons">
    <button class="download-btn" onclick="downloadQR()">
      Download
    </button>

    <button class="print-btn" onclick="printQR()">
      Print
    </button>
  </div>

  <p class="footer">
    Noon Inspired QR Generator Designed by JT10
  </p>

</div>

<script>
let qr;

const qrInput = document.getElementById("qrText");
const qrContainer = document.getElementById("qrcode");

// Live preview while typing
qrInput.addEventListener("input", function () {
  generateQR();
});

function generateQR() {
  const text = qrInput.value.trim();

  qrContainer.innerHTML = "";

  // Placeholder
  if (!text) {
    qrContainer.innerHTML = `
      <div class="qr-box">
        <p class="placeholder-text">
          Live QR Preview will appear here
        </p>
      </div>
    `;
    return;
  }

  const qrBox = document.createElement("div");
  qrBox.className = "qr-box";

  qrContainer.appendChild(qrBox);

  qr = new QRCode(qrBox, {
    text: text,
    width: 220,
    height: 220,
    colorDark: "#3D3D45",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
}

// Download QR
function downloadQR() {
  const img = document.querySelector("#qrcode img");

  if (!img) {
    alert("Generate a QR first!");
    return;
  }

  const link = document.createElement("a");
  link.href = img.src;
  link.download = "qr-code.png";
  link.click();
}

// Print QR
function printQR() {
  const img = document.querySelector("#qrcode img");

  if (!img) {
    alert("Generate a QR first!");
    return;
  }

  const printWindow = window.open("", "_blank");

  printWindow.document.write(`
    <html>
      <head>
        <title>Print QR</title>
      </head>
      <body style="display:flex;justify-content:center;align-items:center;height:100vh;">
        <img src="${img.src}" style="width:300px;" />
        <script>
          window.onload = function() {
            window.print();
            window.close();
          }
        <\/script>
      </body>
    </html>
  `);

  printWindow.document.close();
}

// Initial placeholder
generateQR();
</script>

</body>
</html>
